services:
  api:
    build: .
    container_name: certgen-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override so the API talks to the compose MongoDB service.
      # Remove this line to use MongoDB Atlas via MONGODB_URI in .env.
      MONGODB_URI: mongodb://mongo:27017
    volumes:
      - certificates_data:/code/certificates
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: certgen-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  certificates_data:
  mongo_data:
